[project]
name = "rag-assistant"
version = "0.1.0"
description = "Local rag with proper chunking"
requires-python = ">=3.10"

dependencies = [
    "langchain-ollama",
    "langchain",
    "chromadb",
    "sentence-transformers",
    "pydantic",
    "python-dotenv",
    "rich",
    "pypdf",
]

[tool.black]
line-length = 88

[tool.ruff]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "black (>=25.12.0,<26.0.0)",
    "ruff (>=0.14.10,<0.15.0)"
]

packages = [
    { include = "rag", from = "src" }
]
